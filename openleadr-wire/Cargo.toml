[package]
name = "openleadr-wire"
description = "Encode and decode OpenADR 3.1 messages that go over the wire"
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["web-programming"]

[dependencies]
serde.workspace = true
chrono.workspace = true
serde_with.workspace  = true
iso8601-duration.workspace = true
thiserror.workspace = true
http.workspace = true
url.workspace = true
validator.workspace = true
iso_currency.workspace = true
derive_more.workspace = true
sqlx = { workspace = true, optional = true }

[features]
default = []
# Derive `sqlx::Type` on the identifier newtypes. Only the VTN (which talks to a
# database) needs this; clients such as the lab VEN depend on this crate purely
# to encode and decode OpenADR messages and must not pull in a Postgres driver
# and TLS stack to do it.
sqlx = ["dep:sqlx"]

[dev-dependencies]
serde_json.workspace = true
quickcheck.workspace = true
